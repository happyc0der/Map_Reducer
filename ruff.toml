# Lint configuration for the K-Means-over-MapReduce assignment.
#
#   ruff check .        # report problems
#   ruff check --fix .  # apply the safe fixes
#
# The mapreduce_pb2* files are generated by protoc and are never edited by
# hand, so they are excluded rather than fixed.

target-version = "py310"
extend-exclude = ["mapreduce_pb2.py", "mapreduce_pb2_grpc.py", "mapreduce_pb2.pyi"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # long lines: the log/print strings in this project are wide on purpose
]

[lint.per-file-ignores]
# The gRPC handlers deliberately swallow transport errors so that a dead peer
# is reported to the master instead of killing the serving thread.
"Master.py" = ["BLE001"]
"Reducer.py" = ["BLE001"]
